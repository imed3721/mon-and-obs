name: Deploy Observability Demo

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Website to EC2
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate website
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          grep -q "AWS Observability Platform" index.html

          echo "Website validation passed."

      - name: Encode website
        shell: bash
        run: |
          set -euo pipefail

          base64 -w 0 index.html > index.html.b64

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy to EC2 using Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          CONTENT=$(cat index.html.b64)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy observability demo from GitHub Actions" \
            --parameters "commands=[
              \"set -e\",
              \"echo '$CONTENT' | base64 -d | sudo tee /usr/share/nginx/html/index.html > /dev/null\",
              \"sudo nginx -t\",
              \"sudo systemctl reload nginx\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"
          test "$STATUS" = "Success"

          echo "Deployment completed successfully."
